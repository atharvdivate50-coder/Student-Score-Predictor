<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Page title shown on browser tab -->
    <title>Student Performance Predictor</title>

    <!-- Simple styling so page looks clean -->
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        .box {
            background: white;
            width: 400px;
            margin: auto;
            margin-top: 50px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 8px;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>

    <div class="box">

        <!-- Heading -->
        <h2>Student Performance Prediction</h2>

        <!-- Form sends data to Flask /predict route -->
        <form action="/predict" method="POST">

            <input type="number" step="0.1" name="study_hours" placeholder="Study Hours" required>

            <input type="number" step="0.1" name="previous_score" placeholder="Previous Score" required>

            <input type="number" step="0.1" name="technical_skill" placeholder="Technical Skill (1-10)" required>

            <input type="number" step="0.1" name="assignments_completed" placeholder="Assignments Completed" required>

            <input type="number" step="0.1" name="attendance" placeholder="Attendance %" required>

            <button type="submit">Predict Result</button>

        </form>


        <br>

        <!-- Flask will insert prediction result here -->
        <hr>

        {% if prediction_score %}
        <h2>Prediction Result</h2>

        <p><b>Predicted Score:</b> {{ prediction_score }}</p>
        <p><b>Result:</b> {{ prediction_result }}</p>
        <p><b>Chance of Passing:</b> {{ probability }} %</p>
        {% endif %}


    </div>

</body>

</html>
